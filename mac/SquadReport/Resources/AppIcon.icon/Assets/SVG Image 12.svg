    stroke="#FFFFFF"
    stroke-width="12"
    stroke-opacity="0.78"
  />

  <!-- Far Penalty Box -->
  <polyline
    points="388,414 368,482 656,482 636,414"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-opacity="0.78"
  />

  <!-- Near Penalty Box -->
  <polyline
    points="292,806 326,704 698,704 732,806"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="13"
    stroke-linejoin="round"
    stroke-opacity="0.82"
  />
</svg>
