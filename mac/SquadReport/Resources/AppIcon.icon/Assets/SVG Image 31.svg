<svg xmlns="http://w3.org" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="hardwareWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.86" />
    </linearGradient>

    <linearGradient id="passTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.96" />
    </linearGradient>
  </defs>

  <g transform="rotate(-5 512 532)">
    <!-- 1. SCULPTED TWO-TIER CLIPBOARD CLASP -->
    <!-- Lower Clasp Base Plate -->
    <rect
      x="388" y="182"
      width="248" height="68"
      rx="26"
      fill="#FFFFFF"
      fill-opacity="0.52"
    />
    <!-- Raised Top Grip Bar -->
    <rect
      x="432" y="156"
      width="160" height="54"
      rx="27"
      fill="url(#hardwareWhite)"
    />

    <!-- 2. TACTICAL PASSING ARC + DIRECTIONAL ARROWHEAD -->
    <!-- Sweeping Through-Ball Curve -->
    <path
      d="M 380 684
         C 394 554, 486 462, 622 396"
      fill="none"
      stroke="url(#passTrail)"
      stroke-width="26"
      stroke-linecap="round"
    />
    <!-- Crisp Chevron Arrowhead Pointing Into Space -->
    <path
      d="M 568 372 L 634 390 L 604 452"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. BOLD TACTICAL PLAYER TOKENS -->
    <!-- Ball Carrier / Deep Playmaker (Bottom-Left Solid Disc) -->
    <circle
      cx="380" cy="684" r="46"
      fill="url(#hardwareWhite)"
    />

    <!-- Secondary Runner / Support Player (Mid-Left Solid Disc) -->
    <circle
      cx="372" cy="458" r="38"
      fill="#FFFFFF"
      fill-opacity="0.82"
    />

    <!-- Opposition Defender Marker (Bottom-Right Hollow Ring) -->
    <circle
      cx="644" cy="642" r="38"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.78"
      stroke-width="22"
    />
  </g>
</svg>
