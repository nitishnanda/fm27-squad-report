      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Crisp Directional Chevron Arrowhead -->
    <path
      d="M 578 372 L 646 386 L 618 448"
      fill="none"
      stroke="#34D399"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
