<svg xmlns="http://w3.org" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="emeraldLaser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.68" />
      <stop offset="45%" stop-color="#2CE59B" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g transform="rotate(-5 512 536)">
    <!-- Sweeping Through-Ball Arc Threading Behind the Defender -->
